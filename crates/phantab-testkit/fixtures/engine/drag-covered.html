<!doctype html><html><head><meta charset="utf-8"><title>A list under a clear button</title>
<style>
#list { list-style: none; margin: 0; padding: 0; width: 240px; }
#list li { height: 40px; line-height: 40px; margin: 4px 0; padding: 0 8px; border: 1px solid #888; user-select: none; }
/* A submit button over the whole view that cannot be seen: a mouse press anywhere goes to it. */
#send { position: fixed; inset: 0; width: 100%; height: 100%; opacity: 0; margin: 0; border: 0; }
</style></head>
<body>
<ul id="list"><li id="first">First</li><li id="second">Second</li><li id="third">Third</li></ul>
<form id="note" action="/post/ok" method="post"><button id="send" type="submit">Send</button></form>
<p id="said">not sent</p>
<p id="seen">mouse: none</p>
<script>
// The list sorts by mouse events as `drag.html`'s does; every mouse event the page gets is listed.
const list = document.querySelector('#list');
const seen = [];
for (const kind of ['mousedown', 'mousemove', 'mouseup', 'click']) {
  addEventListener(kind, () => { seen.push(kind); document.querySelector('#seen').textContent = 'mouse: ' + seen.join(', '); }, true);
}
addEventListener('submit', (e) => { e.preventDefault(); document.querySelector('#said').textContent = 'sent the note'; });
let held = null;
list.addEventListener('mousedown', e => { const li = e.target.closest('li'); if (li) held = li; });
document.addEventListener('mouseup', e => {
  const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('li');
  if (held && over && over !== held) list.insertBefore(held, over.nextSibling);
  held = null;
});
</script>
</body></html>
