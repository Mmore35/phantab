<!doctype html><html><head><meta charset="utf-8"><title>Shots</title>
<style>body{margin:0}#box{width:200px;height:120px;background:#c33}#tall{height:3000px;background:linear-gradient(#fff,#336)}iframe{border:0;width:300px;height:200px;display:block}#off,#ariaoff{box-sizing:border-box;width:110px;height:40px;display:block}#ariaoff{width:130px;height:50px;background:#999}</style></head>
<body>
<!-- Screenshots: #box is 200x120 in the document, #inshadow 150x80 in an open shadow root, the frame's
     #inframe 90x70 in a website frame; #off a disabled button 110x40 and #ariaoff an aria-disabled
     element 130x50, which a picture shows though an act would wait for them; #tall makes the page about 3000 px taller than any view. -->
<p>Shot words</p>
<div id="box"></div>
<button id="off" disabled>Off</button>
<div id="ariaoff" aria-disabled="true"></div>
<div id="host"></div>
<iframe src="/engine/shot-frame"></iframe>
<div id="tall"></div>
<script>
document.getElementById('host').attachShadow({ mode: 'open' }).innerHTML =
  '<div id="inshadow" style="width:150px;height:80px;background:#3c3"></div>';
</script>
</body></html>
