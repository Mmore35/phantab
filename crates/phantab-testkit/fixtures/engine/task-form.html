<!doctype html><html><head><meta charset="utf-8"><title>Task form</title>
<style>label{display:block;margin-top:10px;font:14px sans-serif}input,select,textarea{width:420px;font:14px sans-serif}</style></head>
<body>
<form id="request" onsubmit="event.preventDefault();document.getElementById('out').textContent='SUBMITTED '+JSON.stringify(Object.fromEntries(new FormData(this)))">
<label>Short description <input id="request.short_description" name="short_description"></label>
<label>Assignment group <input id="request.assignment_group" name="assignment_group" autocomplete="off"></label>
<label>State <select id="request.state" name="state"><option value="1">Open</option><option value="2">In Progress</option><option value="3">Closed</option></select></label>
<label>Priority <select id="request.priority" name="priority"><option value="4">4 - Low</option><option value="3">3 - Moderate</option><option value="2">2 - High</option></select></label>
<label>Due date <input id="request.due_date" name="due_date"></label>
<label>Notes <textarea id="request.notes" name="notes" rows="4"></textarea></label>
<label>Description <textarea id="request.description" name="description" rows="4"></textarea></label>
<label><input type="checkbox" id="request.active" name="active" style="width:auto"> Active</label>
<button type="submit" id="submit">Submit</button>
</form>
<pre id="out"></pre>
<script>window.requestForm={setValue:(f,v)=>{document.getElementById('request.'+f).value=v;}};</script>
</body></html>
