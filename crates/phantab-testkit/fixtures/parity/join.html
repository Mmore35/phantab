<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Create an account · Northwind Outfitters</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; color: #222; }
header { background: #1d3b2a; color: #fff; padding: 8px 16px; }
header a { color: #fff; margin-left: 12px; font-size: 14px; }
main { padding: 24px 16px; }
.panel { width: 380px; border: 1px solid #ccc; border-radius: 8px; padding: 20px; }
.panel label { display: block; margin: 12px 0 4px; }
.panel input { width: 100%; padding: 8px; box-sizing: border-box; }
.panel button { margin-top: 14px; padding: 8px 16px; }
</style>
</head>
<body>
<header><strong>Northwind Outfitters</strong> <a href="#shop">Shop</a> <a href="#rewards">Trail Rewards</a> <a href="#help">Help</a></header>
<main>
  <section class="panel">
    <h1>Create your account</h1>
    <p>Join Trail Rewards and earn points on every order.</p>
    <form method="post" action="/post/parity-join">
      <label for="name">Full name</label>
      <input type="text" id="name" name="name" autocomplete="name">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" autocomplete="username">
      <label for="password">Password (12 characters or more)</label>
      <input type="password" id="password" name="password" autocomplete="new-password">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" autocomplete="new-password">
      <button type="submit">Create account</button>
    </form>
    <p>Already have an account? <a href="#signin">Sign in</a></p>
  </section>
</main>
</body>
</html>
