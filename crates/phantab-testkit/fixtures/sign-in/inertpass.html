<title>Sign in</title><div><input id="u" autocomplete="username webauthn"><div id="box" inert><input id="p" type="password" autocomplete="current-password"></div><button id="go" disabled>Continue</button><button type="button">Sign in with iPhone</button></div><script>u.oninput=()=>{go.disabled=!u.value;};go.onclick=()=>{if(box.inert)fetch('/post/script',{method:'POST',body:new URLSearchParams({email:u.value})}).then(()=>{box.inert=false;go.textContent='Sign in';});else fetch('/post/script',{method:'POST',body:new URLSearchParams({pass:p.value})}).then(()=>{document.body.innerHTML='<p>Welcome back</p>';});};</script>
